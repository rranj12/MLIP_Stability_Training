# Targeted, bounded contrastive (margin) stability training: Stage B defaults.
# Energies are in eV (StABlE/MDsim convention); the margin is given in units of k_B T.

data:
  src: data/processed          # contains md17/<molecule>/<size>/{train,val,test}
  name: md17                   # on-disk name StABlE expects; labels are rMD17
  size: 1k

pretrained:
  dir: results/checkpoints/qm_pretrained   # <model>/md17-<molecule>_1k_<model>/

simulate:
  n_replicas: 128
  temperature: 500.0
  integrator: Langevin
  timestep_fs: 0.5
  friction_per_ps: 0.1
  check_every_steps: 100       # 50 fs
  max_ps: 10.0
  end_phase_fail_frac: 0.20    # end a rollout once 20% of replicas have failed

detect:
  bond_threshold: 0.25         # Å; NOTE: real rMD17 ethanol test frames reach 0.226 Å (docs/design_notes.md)
  anchor_lag_steps: 500        # x0 is taken this many MD steps before the failure
  bond_scale: 1.2              # bonded if mean training distance < 1.2 x sum of covalent radii

stage_b:                       # fields of mlipstab.train.stage_b.StageBConfig
  n_cycles: 6
  steps_per_cycle: 500
  batch_labeled: 8
  batch_pairs: 16
  lam: 0.1
  margin_kT: 10.0
  temperature: 500.0
  stop_grad_anchor: true
  buffer_capacity: 2000
  guardrail_rel: 0.10
  stop_fail_frac: 0.05
  grad_clip: 1.0

optim:
  name: Adam
  lr: 1.0e-4
  reuse_stage_a_state: true    # continue Stage A's Adam moments, as CRMSE does

localize:
  enabled: false
  cutoff: 5.0                  # Å around the broken bond's two atoms

seed: 0
results_dir: results/margin
