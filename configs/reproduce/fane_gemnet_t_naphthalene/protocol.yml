open_items:
- Reconcile October 2024 corrected manuscript with arXiv v2 results; the current OpenReview
  PDF was inaccessible.
- Full reference and capped-run bond audit are verified, but the one-epoch diagnostic
  produced no failures through 20 ps. The full five-trajectory benchmark remains unrun.
- Agree a full-training execution budget using measured pilot throughput; convergence
  duration remains unknown. Do not launch full training or sweeps yet.
- MD17 is described as nonperiodic in the paper, but upstream uses a 30 Angstrom box
  with PBC flags; preserve/audit actual source behavior rather than silently substitute.
