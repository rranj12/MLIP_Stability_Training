# Protocol reproduction; no job is launched by this file.
# Use pinned upstream MDsim main.py, NOT scripts/pretrain.sh or the margin backend.
# max_epochs=2000 follows paper Table 7; upstream YAML says 10000.
# Run from the upstream checkout so the original scale_file path resolves.
trainer: trainer
dataset:
  src: /vol/data/forces_not_enough/md17
  name: md17
  size: 10k
  molecule: naphthalene
  normalize_labels: false
logger:
  name: tensorboard
task:
  dataset: lmdb
  description: Regressing to energies and forces
  type: regression
  metric: mae
  labels:
  - potential energy
  grad_input: atomic forces
  train_on_free_atoms: true
  eval_on_free_atoms: true
optim:
  early_stopping_time: 604800
  early_stopping_lr: 1.0e-06
  batch_size: 1
  eval_batch_size: 1
  num_workers: 4
  lr_initial: 0.001
  optimizer: AdamW
  optimizer_params:
    eps: 1.0e-07
    weight_decay: 2.0e-06
    amsgrad: true
  scheduler: ReduceLROnPlateau
  patience: 5
  factor: 0.8
  min_lr: 1.0e-06
  max_epochs: 2000
  force_coefficient: 1000
  energy_coefficient: 1
  ema_decay: 0.999
  clip_grad_norm: 10
  loss_energy: mae
  loss_force: l2mae
model:
  name: gemnet_t
  num_spherical: 7
  num_radial: 6
  num_blocks: 4
  emb_size_atom: 128
  emb_size_edge: 128
  emb_size_trip: 64
  emb_size_rbf: 16
  emb_size_cbf: 16
  emb_size_bil_trip: 64
  num_before_skip: 1
  num_after_skip: 1
  num_concat: 1
  num_atom: 2
  cutoff: 5.0
  max_neighbors: 50
  rbf:
    name: gaussian
  envelope:
    name: polynomial
    exponent: 5
  cbf:
    name: spherical_harmonics
  output_init: HeOrthogonal
  activation: silu
  scale_file: configs/md17/gemnet-T-scale.json
  extensive: true
  otf_graph: true
  regress_forces: true
  direct_forces: false
identifier: seed0
