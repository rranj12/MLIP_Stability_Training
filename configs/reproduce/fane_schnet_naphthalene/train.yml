# Fu et al. (arXiv 2210.07237) Table 3 SchNet / naphthalene: 22.5 meV/Å force MAE, 18 (2) ps.
# Upstream MDsim configs/md17/{base,schnet}.yml at commit 61ca2cf, merged. Changes from upstream:
# max_epochs 2000 (paper Table 7; upstream says 10000), tensorboard logger, data path.
# Launch: cloud/modal/fane_train.py. Same data and splits as fane_gemnet_t_naphthalene.
trainer: trainer
dataset:
  src: /vol/data/forces_not_enough/md17
  name: md17
  size: 10k
  molecule: naphthalene
  normalize_labels: false
logger:
  name: tensorboard
task:
  dataset: lmdb
  description: Regressing to energies and forces
  type: regression
  metric: mae
  labels:
  - potential energy
  grad_input: atomic forces
  train_on_free_atoms: true
  eval_on_free_atoms: true
optim:
  early_stopping_time: 604800
  early_stopping_lr: 1.0e-06
  batch_size: 100
  eval_batch_size: 100
  num_workers: 8
  lr_initial: 0.001
  lr_gamma: 0.1
  optimizer: Adam
  warmup_steps: 5000
  warmup_factor: 0.2
  max_epochs: 2000
  energy_coefficient: 0.05
  force_coefficient: 0.95
  scheduler: ReduceLROnPlateau
  patience: 5
  factor: 0.8
  min_lr: 1.0e-06
model:
  name: schnet
  hidden_channels: 64
  num_filters: 64
  num_interactions: 6
  num_gaussians: 25
  cutoff: 5.0
  use_pbc: false
  otf_graph: true
identifier: seed0
