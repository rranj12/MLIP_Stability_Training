[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlipstab"
version = "0.1.0"
description = "Targeted, bounded contrastive stability training for machine-learned interatomic potentials"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "pyyaml"]

[project.optional-dependencies]
analysis = ["lifelines", "matplotlib", "pandas", "scipy"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
